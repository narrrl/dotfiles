source = $HOME/.config/hypr/catppuccin-hyprland/themes/mocha.conf

$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font

# GENERAL
general {
  hide_cursor = true
  no_fade_in = false
  grace = 0
  disable_loading_bar = true
}

# BACKGROUND
background {
  monitor =
  path = $HOME/Pictures/reze/reze.png
  blur_passes = 3
  blur_size = 7
  noise = 0.0117
  contrast = 0.8916
  brightness = 0.8172
  vibrancy = 0.1696
  vibrancy_darkness = 0.0
  color = $base
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = 120
  font_family = $font
  position = 0, 300
  halign = center
  valign = center
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = 30
  font_family = $font
  position = 0, 200
  halign = center
  valign = center
}

# USER AVATAR (Center)
image {
  monitor =
  path = $HOME/.face
  size = 120
  border_color = rgba(255, 255, 255, 0.1)
  position = 0, 50
  halign = center
  valign = center
}

# INPUT FIELD (Center)
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 2
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgba(255, 255, 255, 0.1)
  inner_color = rgba(0, 0, 0, 0.2)
  font_color = $text
  fade_on_empty = false
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $accent
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, -60
  halign = center
  valign = center
}

# --- MUSIC DASHBOARD (TOP RIGHT) ---

# ALBUM ART (At the very top right, 80px high, adjusted -3px for perfect alignment)
image {
    monitor =
    path = /tmp/hyprlock_art.png
    size = 80
    rounding = 15
    border_color = rgba(255, 255, 255, 0.1)
    reload_time = 2
    reload_cmd = ~/.config/hypr/scripts/album_art.sh
    position = -20, -17
    halign = right
    valign = top
}

# MUSIC TEXT BOX (To the left of the image, same height)
shape {
    monitor =
    size = 300, 80
    color = rgba(0, 0, 0, 0.3)
    rounding = 15
    border_size = 1
    border_color = rgba(255, 255, 255, 0.1)
    position = -110, -20
    halign = right
    valign = top
}

# MUSIC TEXT (Right aligned and vertically centered inside the 80px box)
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/songdetail.sh
    color = $text
    font_size = 14
    font_family = $font
    position = -125, -37
    halign = right
    valign = top
    text_align = right
}

# --- STATUS DASHBOARD (BOTTOM RIGHT) ---

# SYSTEM INFO BOX (Vertical stack container)
shape {
    monitor =
    size = 300, 100
    color = rgba(0, 0, 0, 0.3)
    rounding = 15
    border_size = 1
    border_color = rgba(255, 255, 255, 0.1)
    position = -20, 20
    halign = right
    valign = bottom
}

# SYSTEM INFO TEXT (3 lines, top of each other, right aligned)
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/status_info.sh
    color = $text
    font_size = 14
    font_family = $font
    position = -35, 35
    halign = right
    valign = bottom
    text_align = right
}
