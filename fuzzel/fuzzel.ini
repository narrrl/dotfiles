include=~/.config/fuzzel/takemi.ini

[main]
# JetBrainsMono to match Theme.fontMono, so the launcher and the bar are
# visibly the same typeface.
font=JetBrainsMono Nerd Font:size=14
terminal=alacritty
dpi-aware=no

width=45
lines=8
horizontal-pad=20
vertical-pad=20
inner-pad=10

prompt="   "

show-actions=no
layer=overlay
